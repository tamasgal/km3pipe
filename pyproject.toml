[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "km3pipe"
authors = [
  {name = "Tamas Gal", email ="tamas.gal@fau.de"},
  {name = "Moritz Lotze", email ="mlotze@km3net.de"},
]
maintainers = [
  {name = "Tamas Gal", email ="tamas.gal@fau.de"}
]
dependencies = [
    "awkward>=2",
    "docopt-ng",
    "h5py",
    "km3db>=0.6.0",
    "km3io>=1.2.2",
    "matplotlib>=3.0.0",
    "numba>=0.49.0",
    "numpy>=2",
    "packaging>=22.0",
    "particle>=0.8.0",
    "passlib",
    "requests",
    "tables>=3.10",
    "thepipe>=1.3.9",
    "toml",
    "tqdm"
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering"
]
description = "An analysis framework for KM3NeT"
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]

[project.optional-dependencies]
extras = [
    "ipykernel",
    "km3astro",
    "km3flux",
    "pandas",
    "pypandoc",
    "scipy>=1.3.1",
    "seaborn",
    "urwid"
]
dev = [
    "black==26.5.1",
    "build",
    "km3net-testdata>=0.4.0",
    "mock",
    "pillow",
    "pydocstyle",
    "pylint",
    "pytest",
    "pytest-cov",
    "pytest-watch",
    "twine"
]
doc = [
    "memory_profiler",
    "numpydoc",
    "sphinx>=7",
    "sphinx-autoapi",
    "sphinx-gallery",
    "sphinx-rtd-theme>=0.3",
    "sphinxcontrib-programoutput>=0.11",
    "sphinxcontrib-websupport>=1.0.1"
]
all = [
    "km3pipe[extras,dev,doc]"
]

[project.scripts]
km3pipe = "km3pipe.cmd:main"
pipeinspector = "pipeinspector.app:main"
h5extract = "km3pipe.utils.h5extract:main"
h5extractf = "km3pipe.utils.h5extractf:main"
h5info = "km3pipe.utils.h5info:main"
h5tree = "km3pipe.utils.h5tree:main"
h5header = "km3pipe.utils.h5header:main"
ztplot = "km3pipe.utils.ztplot:main"
k40calib = "km3pipe.utils.k40calib:main"
triggermap = "km3pipe.utils.triggermap:main"
nb2sphx = "km3pipe.utils.nb2sphx:main"
ligiermirror = "km3pipe.utils.ligiermirror:main"
qrunprocessor = "km3pipe.utils.qrunprocessor:main"
qrunqaqc = "km3pipe.utils.qrunqaqc:main"
daqsample = "km3pipe.utils.daqsample:main"
tres = "km3pipe.utils.tres:main"


[project.urls]
Homepage = "https://git.km3net.de/km3py/km3pipe"
Documentation = "https://km3py.pages.km3net.de/km3pipe/"
Repository = "https://git.km3net.de/km3py/km3pipe.git"
Issues = "https://git.km3net.de/km3py/km3pipe/-/issues"
Changelog = "https://km3py.pages.km3net.de/km3pipe/changelog.html"

[tool.setuptools_scm]
version_file = "src/km3pipe/version.py"
write_to_source = true

[tool.black]
target-version = ["py311", "py312", "py313", "py314"]
extend-exclude = "src/km3pipe/version.py"

[tool.pytest.ini_options]
testpaths = ["src"]
junit_suite_name = "km3pipe"

[tool.coverage.run]
source = ["src/km3pipe", "src/km3modules"]
omit = [
    "src/km3pipe/utils/*",
    "src/km3pipe/version.py",
    "src/km3pipe/io/i3.py",
    "src/km3modules/dummy.py",
    "*/tests/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if self.debug:"
]
