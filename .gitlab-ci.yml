image: git.km3net.de:4567/common/dockerfiles/base/python:3.12

# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_HOST: tcp://docker:2375
  # the dind entrypoint only binds the plain 2375 port when this is empty,
  # otherwise it enables TLS and listens on 2376 only
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  CONTAINER_TEST_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  CONTAINER_RELEASE_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
  CONTAINER_LATEST_IMAGE: $CI_REGISTRY_IMAGE:latest
  SINGULARITY_RELEASE_IMAGE: km3pipe_${CI_COMMIT_TAG}.sif


# Pip's cache doesn't store the python packages
# https://pip.pypa.io/en/stable/reference/pip_install/#caching
#
# If you want to also cache the installed packages, you have to install
# them in a virtualenv and cache it as well.
cache:
  paths:
    - .cache/pip
  key: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"

stages:
  - test
  - coverage
  - doc
  - docker
  - singularity
  - release

.virtualenv_template: &virtualenv_definition |
  python -V
  pip install -U pip setuptools wheel
  python -m venv venv
  source venv/bin/activate
  make install-dev
  pip freeze

.junit_template: &junit_definition
    artifacts:
      reports:
        junit: "reports/junit*.xml"

test:
    stage: test
    image: python:$PYTHON_VERSION
    parallel:
        matrix:
            - PYTHON_VERSION: ["3.11", "3.12", "3.13", "3.14"]
    script:
        - *virtualenv_definition
        - make test
    <<: *junit_definition

benchmarks:
    stage: test
    script:
        - *virtualenv_definition
        - make benchmark
    <<: *junit_definition
    allow_failure: true

code-style:
    stage: test
    script:
        - *virtualenv_definition
        - make black-check
    allow_failure: true

coverage:
    stage: coverage
    script:
        - *virtualenv_definition
        - make test-cov | tee coverage.log
        - "grep TOTAL coverage.log | awk '{printf \"COVERAGE: %.2f%%\", (1-$3/$2)*100 }'"
    coverage: '/COVERAGE:\s*([0-9]*\.[0-9]*%)/'
    artifacts:
        paths:
            - reports/coverage

docs:
    stage: doc
    script:
        - *virtualenv_definition
        - make doc
    cache: []

pages:
    stage: doc
    script:
        - *virtualenv_definition
        - make doc
        - mv doc/_build/html public/
        - mv reports/coverage public/coverage
    artifacts:
        paths:
            - public
    cache: []
    rules:
        - if: $CI_COMMIT_TAG
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

docker:
  image: docker:28-cli
  services:
    - docker:28-dind
  stage: docker
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build --pull -t $CONTAINER_TEST_IMAGE .
    - docker push $CONTAINER_TEST_IMAGE
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_TAG

pypi:
    stage: release
    cache: []
    script:
        - pip install -U build twine
        - python -m build
        - twine upload dist/*
    rules:
        - if: $CI_COMMIT_TAG

release-docker:
  image: docker:28-cli
  services:
    - docker:28-dind
  stage: release
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $CONTAINER_TEST_IMAGE
    - docker tag $CONTAINER_TEST_IMAGE $CONTAINER_RELEASE_IMAGE
    - docker tag $CONTAINER_TEST_IMAGE $CONTAINER_LATEST_IMAGE
    - docker push $CONTAINER_RELEASE_IMAGE
    - docker push $CONTAINER_LATEST_IMAGE
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_TAG

release-singularity:
  image: git.km3net.de:4567/common/dockerfiles/base/singularity:3.6.2
  stage: release
  script:
    - singularity build $SINGULARITY_RELEASE_IMAGE docker://$CONTAINER_TEST_IMAGE
    - du -sh $SINGULARITY_RELEASE_IMAGE
    - mkdir -p ~/.ssh && ssh-keyscan -H -t rsa $KM3NET_SFTP_HOST  >> ~/.ssh/known_hosts
    - apt install -q lftp
    - lftp -u $KM3NET_SFTP_USER,$KM3NET_SFTP_PASSWORD sftp://$KM3NET_SFTP_HOST -e "set ssl:verify-certificate no; cd singularity/; put $SINGULARITY_RELEASE_IMAGE; bye"
  rules:
    - if: $CI_COMMIT_TAG

cc-lyon:
    image: git.km3net.de:4567/common/dockerfiles/base/ci-helper:1
    stage: release
    script:
        - mkdir -p /root/.ssh && chmod 700 /root/.ssh
        - ssh-keyscan -H $IN2P3_HOST > ~/.ssh/known_hosts
        - chmod 600 /root/.ssh/known_hosts
        - sshpass -p $IN2P3_PASSWORD ssh -v $IN2P3_USERNAME@$IN2P3_HOST 'export KM3NET_THRONG_DIR=/pbs/throng/km3net; export MODULEPATH=/pbs/throng/km3net/modulefiles; . /usr/share/Modules/init/bash; module load km3net_soft_env; pip install git+https://git.km3net.de/km3py/km3pipe.git'
    rules:
        - if: $CI_COMMIT_TAG
    allow_failure: true
